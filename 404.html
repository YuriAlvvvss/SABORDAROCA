<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Sabor da Roça</title>
  <meta name="description" content="A página que você procurou não existe. Volte ao início da Sabor da Roça ou fale conosco no WhatsApp.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#374001">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="canonical" href="https://sabordaroca.me/">
  <link rel="icon" href="./assets/favicon.png" type="image/png">
  <link rel="manifest" href="./manifest.json">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;line-height:1.6;color:#5A1903;background:#F4E6CE;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
    .caixa{max-width:480px;background:#FFF7E8;border:1px solid rgba(90,25,3,.14);border-top:3px solid #E86531;border-radius:14px;padding:2.5rem 2rem;box-shadow:0 18px 40px rgba(90,25,3,.14)}
    h1{font-family:Georgia,serif;font-size:2rem;margin-bottom:.5rem}
    p{opacity:.85;margin-bottom:1rem}
    .codigo{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#E86531;margin-bottom:.75rem}
    .acoes{display:flex;flex-direction:column;gap:.75rem;margin-top:1.5rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:.8rem 1.6rem;border-radius:8px;font-weight:600;min-height:44px;text-decoration:none}
    .btn--primario{background:#E86531;color:#FFF7E8}
    .btn--secundario{border:2px solid #E86531;color:#E86531}
  </style>
</head>
<body>
  <main class="caixa">
    <p class="codigo">Erro 404</p>
    <h1>Essa página saiu da roça…</h1>
    <p>O endereço que você tentou não existe ou foi movido. Que tal voltar ao início ou falar direto com a gente?</p>
    <div class="acoes">
      <a class="btn btn--primario" href="./">Voltar ao início</a>
      <a class="btn btn--secundario" href="https://wa.me/5511921347467?text=Ol%C3%A1!%20Vim%20pelo%20site%20Sabor%20da%20Ro%C3%A7a%20e%20quero%20fazer%20um%20pedido." target="_blank" rel="noopener noreferrer">Falar no WhatsApp</a>
    </div>
  </main>
  <!-- Apenas analytics anônimo no 404 (sem GA sem consentimento) -->
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
